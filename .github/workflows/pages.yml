# Сборка и публикация на GitHub Pages.
#
# Главная страница — «НЕ СПИ» (папка game/).
# Старая логическая игра остаётся доступной по адресу /old/.
#
# Pages должен быть включён один раз: Settings → Pages → Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # старая игра: комната не должна стать непроходимой
      - name: Проверить старую игру
        run: node tests/solvability.mjs

      # новая игра: геометрия дома, ввод, меши, мир — всё без браузера
      - name: Проверить дом и персонажа
        working-directory: game
        run: npm test

      - name: Собрать сайт
        run: node game/tools/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
